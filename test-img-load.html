<!DOCTYPE html>
<html>
<head>
<style>
.test-bg {
  width: 400px;
  height: 300px;
  margin: 20px;
  border: 2px solid red;
  background-size: cover;
  background-position: center;
}
.encoded {
  background-image: url('data/images/antes%20sin%20%C3%A1rboles.PNG');
}
.literal {
  background-image: url('data/images/antes sin árboles.PNG');
}
</style>
</head>
<body>
<h1>Testing image loading</h1>

<h2>Encoded URL:</h2>
<div class="test-bg encoded"></div>

<h2>Literal URL:</h2>
<div class="test-bg literal"></div>

<h2>IMG tag (for comparison):</h2>
<img src="data/images/antes%20sin%20%C3%A1rboles.PNG" style="max-width: 400px;">

<script>
console.log('Testing image loads...');
const img = new Image();
img.onload = () => console.log('✓ Image loaded via JS');
img.onerror = () => console.log('✗ Image failed to load');
img.src = 'data/images/antes%20sin%20%C3%A1rboles.PNG';
</script>
</body>
</html>
